<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Profile Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f5;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-pink: #ff8da1;
            --text-dark: #5a3d46;
            --text-light: #8a6c75;
            --shadow: 0 15px 35px rgba(255, 141, 161, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #sakura-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .profile-card { position: relative; z-index: 1; background: var(--card-bg); backdrop-filter: blur(10px); width: 340px; border-radius: 30px; padding: 40px 30px; box-shadow: var(--shadow); text-align: center; border: 2px solid rgba(255, 255, 255, 0.5); }
        .avatar-container { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; cursor: pointer; border-radius: 50%; box-shadow: 0 8px 20px rgba(255, 141, 161, 0.4); background: white; padding: 4px; }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .avatar-overlay { position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; background: rgba(0, 0, 0, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
        .avatar-container:hover .avatar-overlay { opacity: 1; }
        .badge { position: absolute; background: white; color: var(--primary-pink); font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ffe4e1; pointer-events: none; }
        .badge-1 { top: -10px; right: -20px; } .badge-2 { bottom: 10px; left: -30px; } .badge-4 { bottom: -5px; right: -15px; }
        input[type="text"], textarea { width: 100%; border: none; background: transparent; text-align: center; color: var(--text-dark); outline: none; resize: none; border-radius: 8px; }
        .user-name { font-size: 24px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .user-role { font-size: 11px; font-weight: 700; color: var(--primary-pink); border: 1px solid var(--primary-pink); padding: 4px 12px; border-radius: 15px; margin-bottom: 20px; display: inline-block; }
        .user-quote { font-family: 'Dancing Script', cursive; font-size: 22px; color: var(--primary-pink); margin-bottom: 20px; height: 70px; overflow: hidden; }
        .user-desc { font-size: 13px; color: var(--text-light); margin-bottom: 25px; height: 75px; overflow: hidden; }
        .btn { border: none; padding: 12px 20px; border-radius: 25px; font-family: 'Quicksand', sans-serif; font-weight: 700; cursor: pointer; width: 100%; transition: all 0.3s; }
        .btn-save { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #5a3d46; margin-bottom: 10px; }
        .btn-portfolio { background: transparent; border: 2px solid #ffe4e1; color: var(--text-dark); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: #fff0f5; padding: 30px; border-radius: 20px; text-align: center; max-width: 300px; position: relative; }
        .close-modal { position: absolute; top: -15px; right: -15px; background: var(--primary-pink); color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
    <canvas id="sakura-canvas"></canvas>
    <div class="profile-card">
        <div class="avatar-container" id="avatar-container">
            <img id="avatar-img" src="https://api.dicebear.com/9.x/micah/svg?seed=HieuHanh" alt="Avatar">
            <div class="avatar-overlay">Thay ảnh</div>
            <input type="file" id="file-upload" accept="image/*" hidden>
            <div class="badge badge-1">Uống 2 lít nước chưa?</div>
            <div class="badge badge-2">Thẳng lưng</div>
            <div class="badge badge-4">Xin chào</div>
        </div>
        <input type="text" class="user-name" id="input-name" value="HIỂU HẠNH">
        <div class="user-role">SALES ADMIN</div>
        <textarea class="user-quote" id="input-quote">"Những gì xinh đẹp thường đứng một mình :>"</textarea>
        <textarea class="user-desc" id="input-desc">Phía sau đội Sales "chốt đơn như gió" là một Sales Admin âm thầm check lại hợp đồng lần thứ 3 =)))</textarea>
        <button class="btn btn-save" id="btn-save">Lưu thay đổi</button>
        <button class="btn btn-portfolio" id="btn-portfolio">Xem Portfolio</button>
    </div>

    <div class="modal-overlay" id="portfolio-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h3 style="color:#5a3d46;">🚧 Đang cập nhật</h3>
            <p style="color:#666; margin-top:10px;">Chúng tôi sẽ cập nhật vào thời gian sớm nhất !!!</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let petals = Array.from({length: 35}, () => ({
            x: Math.random() * canvas.width, y: Math.random() * canvas.height,
            size: Math.random() * 10 + 5, speed: Math.random() * 2 + 1
        }));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffb7c5";
            petals.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                p.y += p.speed; if (p.y > canvas.height) p.y = -10;
            });
            requestAnimationFrame(animate);
        }
        animate();

        document.getElementById('btn-portfolio').onclick = () => document.getElementById('portfolio-modal').style.display = 'flex';
        document.getElementById('close-modal').onclick = () => document.getElementById('portfolio-modal').style.display = 'none';
        document.getElementById('btn-save').onclick = () => alert("Đã lưu thay đổi!");
    </script>
</body>
</html>
